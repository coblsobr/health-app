name: Publish update

# Every push to main ships an over-the-air update to the phone.
# This replaces JavaScript and assets only — if a push changes native code
# (a new native module, an SDK bump), the fingerprint runtimeVersion changes
# and the phone will keep its current build until you install a fresh APK.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # --branch main, because the `preview` channel the APK was built on is
      # mapped to the `main` branch. Publishing to a branch no channel points
      # at succeeds, reports success, and reaches no phone.
      # --environment is required in --non-interactive mode.
      - name: Publish the update
        env:
          # Through the environment, never interpolated into the command line.
          # A commit message containing a double quote closes the --message
          # string early and breaks the step, which is exactly how this failed
          # the first time it met a real commit message. The same substitution
          # would also let anything in a commit message run as shell.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SUMMARY=$(printf '%s' "$COMMIT_MESSAGE" | head -1 | cut -c1-180)
          eas update --branch main --environment production --message "$SUMMARY" --non-interactive
