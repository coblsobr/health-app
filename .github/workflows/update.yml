name: Publish update

# Every push to main ships an over-the-air update to the phone.
# This replaces JavaScript and assets only — if a push changes native code
# (a new native module, an SDK bump), the fingerprint runtimeVersion changes
# and the phone will keep its current build until you install a fresh APK.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # --branch main, because the `preview` channel the APK was built on is
      # mapped to the `main` branch. Publishing to a branch no channel points
      # at succeeds, reports success, and reaches no phone.
      # --environment is required in --non-interactive mode.
      - name: Publish the update
        run: eas update --branch main --environment production --message "${{ github.event.head_commit.message }}" --non-interactive
